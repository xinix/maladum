rarity_common: Objet commun - Après le tutoriel placer ces jetons dans le sac de pioche.
rarity_uncommon: Objets inhabituels - Les objets inhabituels doivent être rangés à part dans un sac avec les autres objets inhabituels.
rarity_rare: Objets rares - Les objets rares doivent être rangés à part dans un sac avec les autres objets rares.
