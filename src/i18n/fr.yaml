about-me: >-
  Salut ! Je m'appelle Nico et je suis un grand passionné de Core Space et de Maladum.
  Dès que j'ai découvert Core Space sur le site
  <a href="https://www.orderofgamers.com/games/core-space/" target="_blank">Esoteric Order of Gamers</a>, j'ai tout de suite
  accroché. J'ai acheté la boîte de base ainsi que toutes les extensions disponibles. En 2020,
  j'ai participé à la campagne Kickstarter de « First Born » et j'ai là aussi tout pris 😋.
  <br/><br/>En 2022, je me suis porté volontaire pour présenter « First Born » lors du
  salon Spiel à Essen, en Allemagne, et j'ai eu la chance d'être sélectionné. J'y ai animé des
  démonstrations du jeu pendant deux jours, ce qui m'a permis de travailler aux côtés de Colin,
  Steward et Simon. Après Essen, j'ai eu l'idée de créer une application pour Core Space, permettant
  aux joueurs de consulter les jetons d'objets trouvés en cours de partie et d'obtenir des
  explications détaillées sur leurs symboles. Quelques années plus tard, comme j'avais acquis
  l'ensemble de la gamme Maladum, j'ai décidé de développer une application dédiée à ce jeu également.
